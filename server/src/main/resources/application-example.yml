# 复制此文件为 application.yml 并填入你的配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/topo_pilot?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 你的MySQL密码
  data:
    redis:
      host: localhost
      port: 6379

deepseek:
  # 推荐用环境变量注入，不写进文件：export DEEPSEEK_API_KEY=你的Key（Windows 用 set）
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat

ensp:
  # eNSP 所在主机：本机运行默认 127.0.0.1，Docker 部署设为 host.docker.internal
  host: ${ENSP_HOST:127.0.0.1}
